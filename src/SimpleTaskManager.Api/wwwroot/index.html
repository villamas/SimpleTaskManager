<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Task Manager</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Simple Task Manager</h1>

    <form id="create-form" class="create-form">
      <label class="visually-hidden" for="new-title">New task</label>
      <input id="new-title" name="title" type="text" maxlength="255" placeholder="What needs to be done?" required>
      <button type="submit">Add task</button>
    </form>

    <div class="toolbar">
      <label for="filter">Show</label>
      <select id="filter">
        <option value="All">All</option>
        <option value="Pending">Pending</option>
        <option value="Completed">Completed</option>
      </select>
    </div>

    <p id="message" class="message" role="status" aria-live="polite"></p>
    <ul id="task-list" class="task-list"></ul>
    <p id="empty-state" class="empty-state" hidden>No tasks to show.</p>
  </main>
</body>
</html>
